<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 🤎</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  overflow-x: hidden;
  background: linear-gradient(-45deg, #d7b899, #e6ccb2, #d2a679, #e8c4a3);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.intro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: #d7b899;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.intro button {
  padding: 15px 30px;
  border: none;
  border-radius: 15px;
  background: white;
  color: #8b5e3c;
  font-size: 16px;
}

.container {
  display: none;
  max-width: 600px;
  margin: auto;
  margin-top: 60px;
  padding: 30px;
  background: white;
  border-radius: 20px;
  text-align: center;
}

.heart {
  position: fixed;
  bottom: -30px;
  font-size: 22px;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

.spotify-btn {
  display: block;
  margin-top: 25px;
  padding: 14px;
  background: #8b5e3c;
  color: white;
  text-decoration: none;
  border-radius: 12px;
}

audio {
  width: 100%;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="intro" id="intro">
<h2>For You 🤎</h2>
<button onclick="enterSite()">Tap to Enter</button>
</div>

<div class="container" id="main">
<h1>For Amy 🤎</h1>

<div id="typedText"></div>

<audio id="bgMusic" loop>
<source src="music/song.mp3" type="audio/mpeg">
</audio>

<a class="spotify-btn"
href="https://open.spotify.com/playlist/1xHAwtAuD68KNv2Wus0N6d?si=15e05ca3b11042ab"
target="_blank">
Our Playlist 🎵
</a>

</div>

<script>

const message = `Happy Valentines day, Chemu!!!!
Thought I'd do this for our very first Valentines day. I know you hate flowers and I hope this will suffice.
And even though we may be miles apart, you feel closer than ever. I literally cannot stop thinking about you.
I think about the way you laugh, the way you smile, the way you support me, and the way you make me feel seen and loved.
The distance may be temporary, but what we are buidling is not. The future is bright, I just know it.
One day, we will never have to say goodbye again. We are going to wake up next to each other and realise that we have all the time we could ever want.
As we celebrate love alongside billions today, I wanted to express my complete and unwavering devotion to you. 
I would give anything, anything, just to hold your hand for a second longer, to have you next to me for just another day.
But, the distance is nothing but a reminder of what we have. The gravity of it.
Beacause whether your right next to me, or halfway across the world, I'll always love you.
Because, you are worth it. You are what I have waited for all my life.
I love you so much. 
I choose you, in every universe`;

let i = 0;

function typeWriter(){
  if(i < message.length){
    document.getElementById("typedText").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeWriter, 35);
  }
}

function enterSite(){
  document.getElementById("intro").style.display = "none";
  document.getElementById("main").style.display = "block";
  document.getElementById("bgMusic").play();
  typeWriter();
  spawnHearts();
}

function spawnHearts(){
  setInterval(function(){
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = Math.random() > 0.5 ? "🤎" : "🌸";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (8 + Math.random()*5) + "s";
    document.body.appendChild(heart);

    setTimeout(function(){
      heart.remove();
    }, 12000);

  }, 800);
}

</script>

</body>
</html>
